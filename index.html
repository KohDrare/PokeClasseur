<style>
/* Layout: Pokécardex-like — grey hero band per page, white work surface, navy pill actions. */
:root{
  --bg:#f3f5f8; --band:#dfe4ea; --surface:#ffffff; --surface-2:#eef1f5;
  --fg:#16192b; --muted:#5d6478; --line:#d5dae2;
  --navy:#25348f; --navy-ink:#ffffff; --navy-soft:#e3e7fa;
  --gold:#d9a21b; --silver:#9aa3b2; --red:#e2404a; --orange:#f0a32a; --ok:#1f9d63;
  --shadow:0 1px 2px rgba(20,25,60,.08),0 6px 18px rgba(20,25,60,.06);
  --ui:"Urbanist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --sil:brightness(0) opacity(.2); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --band:#171b2e; --surface:#1a1f33; --surface-2:#222842;
  --fg:#eceff8; --muted:#9ba3bd; --line:#2c3350;
  --navy:#5c6fe0; --navy-ink:#ffffff; --navy-soft:#262e57;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.25); --sil:brightness(0) invert(1) opacity(.16); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1220; --band:#171b2e; --surface:#1a1f33; --surface-2:#222842;
  --fg:#eceff8; --muted:#9ba3bd; --line:#2c3350;
  --navy:#5c6fe0; --navy-ink:#ffffff; --navy-soft:#262e57;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.25); --sil:brightness(0) invert(1) opacity(.16); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:500 15px/1.45 var(--ui);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:19px;letter-spacing:-.01em;margin-right:auto}
.brand b{color:var(--red)}
.brand svg{width:28px;height:28px}
.navbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:0;background:transparent;font-weight:600;text-decoration:none;white-space:nowrap}
.navbtn:hover{background:var(--surface-2)}
.navbtn.on{background:var(--navy-soft);color:var(--navy)}
.navbtn svg{width:18px;height:18px;flex:none}
.iconbtn{width:38px;height:38px;border-radius:999px;border:0;background:transparent;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:19px;height:19px}
@media (max-width:620px){.navbtn span{display:none}.navbtn{padding:9px}.brand span{display:none}}

/* hero band */
.band{background:var(--band);padding-block:28px 30px}
.crumb{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:10px}
.crumb:hover{color:var(--fg)}
h1{font-size:clamp(28px,4vw,44px);line-height:1.05;margin:0 0 4px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:600;font-size:14.5px;box-shadow:var(--shadow);white-space:nowrap}
.chip svg{width:17px;height:17px}
.chip img{height:16px;width:auto}
.code{font-family:var(--mono);font-size:12.5px;background:#2a2d36;color:#fff;border-radius:5px;padding:2px 6px;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:var(--navy-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700;text-decoration:none}
.pill.ghost{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.pill svg{width:18px;height:18px}

/* set hero */
.sethero{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:28px 72px;margin:18px auto 8px;max-width:1100px}
.sethero .logo{display:flex;justify-content:center;align-items:center;min-height:140px;flex:0 1 480px;min-width:0}
.sethero .logo img{max-height:170px;max-width:100%;width:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.2))}
.sethero .meta{display:flex;flex-direction:column;gap:14px;align-items:center;flex:0 1 auto;min-width:0}
.sethero .chips{justify-content:center}
.sethero .progress{align-self:stretch;justify-content:center}
.herobtns{justify-content:center}
.titlecenter{text-align:center;margin:6px 0 6px}
#sethead{padding-block:6px 18px}
@media (max-width:780px){.sethero{gap:18px}.sethero .logo img{max-height:120px}}
.progress{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow)}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--navy) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring::after{content:attr(data-l);width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 13px var(--ui)}
.progress .t{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.progress .s{color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:22px 14px}
.rar{display:flex;flex-wrap:wrap;gap:8px}
.rbtn{min-width:48px;height:48px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:2px;font-size:17px;line-height:1}
.rbtn:hover{border-color:var(--navy)}
.rbtn.on{background:var(--navy-soft);border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.rbtn small{font:600 11px var(--ui);color:var(--muted);margin-left:5px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:15.5px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 13px;font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg button svg{width:16px;height:16px}
.seg em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.toggle.on{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}
.toggle svg{width:18px;height:18px}
.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-bottom:16px}
.loadbar{height:3px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-bottom:12px}
.loadbar i{display:block;height:100%;background:var(--navy);width:0;transition:width .2s}
.note{color:var(--muted);font-size:13.5px}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;padding-bottom:60px}
@media (max-width:480px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}}
.tile{position:relative;min-width:0}
.cardimg{position:relative;aspect-ratio:63/88;border-radius:4.5%/3.3%;overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow);transition:transform .18s ease,filter .25s,opacity .25s;display:block;width:100%;border:0;padding:0}
.cardimg img{width:100%;height:100%;object-fit:cover;display:block}
.tile button.cardimg:hover{transform:translateY(-3px)}
.tile.missing .cardimg{filter:grayscale(.85);opacity:.5}
.tile.missing .cardimg:hover{opacity:.85;filter:none}
.fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;font-weight:700;font-size:13px;color:var(--muted);background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px)}
.check{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:rgba(20,22,40,.45);display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .12s,background .15s}
.check svg{width:17px;height:17px;opacity:.7}
.check:hover{transform:scale(1.08)}
.tile.owned .check{background:var(--ok)}
.tile.owned .check svg{opacity:1}
.qty{position:absolute;left:6px;top:6px;background:var(--navy);color:#fff;font:700 12px var(--ui);padding:3px 8px;border-radius:999px}
.vtag{position:absolute;left:6px;bottom:6px;font:700 11px var(--ui);padding:3px 8px;border-radius:999px;background:rgba(15,18,40,.75);color:#fff;letter-spacing:.02em}
/* foil: holo = rainbow over the whole card, reverse = foil on the frame only (art window stays matte). --mx/--my follow the pointer */
.fx{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s ease;z-index:1;overflow:hidden}
.fx::before,.fx::after{content:"";position:absolute;inset:0;border-radius:inherit}
.fx::before{background:repeating-linear-gradient(115deg,#ff4d6d 0%,#ffb347 6%,#fff35c 12%,#4dff9a 18%,#4dd2ff 24%,#7b6bff 30%,#ff5ce1 36%,#ff4d6d 42%);background-size:200% 200%;background-position:var(--mx,50%) var(--my,50%);mix-blend-mode:color-dodge;opacity:.2;filter:saturate(1.3)}
.fx::after{background:radial-gradient(farthest-corner circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.5) 0%,rgba(255,255,255,.1) 25%,rgba(255,255,255,0) 55%);mix-blend-mode:screen;opacity:.5}
.fx.f-holo::after{opacity:.6;background:radial-gradient(farthest-corner circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.75) 0%,rgba(255,255,255,.15) 25%,rgba(255,255,255,0) 55%),repeating-linear-gradient(55deg,rgba(255,255,255,0) 0 6px,rgba(255,255,255,.12) 6px 7px)}
.fx.f-rev::before{background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.85) 2%,rgba(255,255,255,0) 4%),repeating-linear-gradient(115deg,#ff8fb1 0%,#ffe29a 9%,#9df5c4 18%,#8fd8ff 27%,#c7a2ff 36%,#ff8fb1 45%);background-size:300% 300%,240% 240%;background-position:var(--mx,50%) var(--my,50%),calc(100% - var(--mx,50%)) var(--my,50%);mix-blend-mode:overlay;opacity:.32}
.fx.f-rev{-webkit-mask:linear-gradient(#000 0 0),linear-gradient(#000 0 0) 50% 15.2%/86.4% 37.6% no-repeat;-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) exclude,linear-gradient(#000 0 0) 50% 15.2%/86.4% 37.6% no-repeat}
.cardimg:hover .fx,.slot:hover .fx,.holo .fx{opacity:1}
.holo .fx{opacity:.55;transition:opacity .25s}
.holo:hover .fx,.holo.touching .fx{opacity:1}
@media (hover:none){.holo .fx{animation:fxdrift 6s ease-in-out infinite alternate}}
@keyframes fxdrift{from{--mx:10%;--my:20%}to{--mx:90%;--my:80%}}
@property --mx{syntax:"<percentage>";inherits:true;initial-value:50%}
@property --my{syntax:"<percentage>";inherits:true;initial-value:50%}
.ftag.rare{display:inline-flex;align-items:center;gap:4px;background:rgba(18,20,34,.82);color:#fff;text-transform:none;letter-spacing:.01em;font-size:10.5px;padding:3px 8px 3px 6px}
.ftag.rare .rsvg{width:12px;height:12px;color:#fff}
.vtag{max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftag{position:absolute;right:6px;bottom:6px;z-index:2;font:800 9.5px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:999px;color:#1d1f33;background:linear-gradient(110deg,#ffd6e8,#fff4c2,#cfffe6,#cfeeff,#e6d6ff);box-shadow:0 1px 3px rgba(0,0,0,.3);opacity:.92}
.cap{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:13px;min-width:0}
.cap .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none}
.cap .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cap .pr{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
@media (max-width:480px){.cap .pr{display:none}.check{width:28px;height:28px}}
.sym{display:inline-flex;align-items:center;flex:none;line-height:1}
.rsvg{width:15px;height:15px;display:block}
.rbtn .rsvg{width:22px;height:22px}
.facts .rsvg{width:17px;height:17px}
.facts dd .sym{vertical-align:-3px;margin-right:4px}
.sym.gold{color:var(--gold)}.sym.silver{color:var(--silver)}.sym.pink{color:#e0569b}.sym.teal{color:#1ba6a6}

/* binder: an open 9-pocket album — leatherette cover, two pocket pages, metal rings in the spine */
#cards{scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.binder{--cover:#1b1e27;--cover-2:#242833;--pagebg:#262a35;--dash:rgba(220,226,240,.16);
  position:relative;display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr);margin:0 auto 22px;padding:12px;border-radius:14px;
  background:radial-gradient(120% 140% at 30% 0%,var(--cover-2),var(--cover) 60%);
  box-shadow:0 22px 50px rgba(8,10,25,.4),0 1px 0 rgba(255,255,255,.05) inset;
  max-width:min(100%,calc((100vh - 200px) * 1.5));max-width:min(100%,calc((100dvh - 200px) * 1.5))}
.binder.single{grid-template-columns:8px minmax(0,1fr);max-width:min(100%,calc((100dvh - 200px) * .76))}
.page{position:relative;background:var(--pagebg);padding:8px;border-radius:6px}
.page.left{border-radius:7px 2px 2px 7px;box-shadow:inset -10px 0 14px -10px rgba(0,0,0,.55)}
.page.right{border-radius:2px 7px 7px 2px;box-shadow:inset 10px 0 14px -10px rgba(0,0,0,.55)}
.page.blank .slots{opacity:.5}
.spine{position:relative;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.03) 50%,rgba(0,0,0,.35));display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:30px 0}
.single .spine{margin-left:-4px;background:transparent}
.spine i{display:block;width:4px;height:18px;border-radius:2px;background:linear-gradient(90deg,#4b505c,#9ea3ae,#4b505c);opacity:.55}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.slot{position:relative;aspect-ratio:63/88;border:0;padding:6px;margin:0;background:transparent;display:block;width:100%}
.slot:nth-child(3n+1)::before,.slot:nth-child(3n+2)::before{content:"";position:absolute;right:0;top:14%;bottom:14%;border-right:1px dashed var(--dash);pointer-events:none}
.slot:nth-child(-n+6)::after{content:"";position:absolute;bottom:0;left:16%;right:16%;border-bottom:1px dashed var(--dash);pointer-events:none}
.slot img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4.5%/3.3%;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.slotcard{position:relative;display:block;width:100%;height:100%;border-radius:4.5%/3.3%;transition:transform .15s}
.slot.has:hover .slotcard{transform:translateY(-2px)}
.slot.has .shine{position:absolute;inset:6px;border-radius:4.5%/3.3%;background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,transparent 30%,transparent 75%,rgba(255,255,255,.06) 100%);pointer-events:none}

.slot .empty{position:absolute;inset:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;color:rgba(225,229,240,.4);border-radius:4.5%/3.3%;background:rgba(0,0,0,.12)}
.slot .empty b{font-family:var(--mono);font-size:clamp(11px,1.3vw,15px);color:rgba(225,229,240,.6);font-weight:500}
.slot .empty span{font-size:clamp(9.5px,1vw,12px);font-weight:600;line-height:1.2}
.slot .empty .ghost{position:absolute;inset:0;opacity:.07;background-size:cover;background-position:center;filter:grayscale(1);border-radius:inherit}
.slot:hover .empty{color:rgba(225,229,240,.7)}
.pagenum{color:rgba(225,229,240,.38);font:500 11px var(--mono);text-align:center;margin-top:7px;letter-spacing:.05em}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:60px}
.pager span{font-weight:700;font-variant-numeric:tabular-nums;min-width:0;text-align:center}
@media (max-width:480px){.pager .pill{font-size:0;padding:12px 14px}.pager{gap:8px}}

/* checklist */
.list{columns:3 320px;column-gap:28px;padding-bottom:60px}
.li{break-inside:avoid;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:14.5px}
.li:nth-child(odd){background:var(--surface-2)}
.li .n{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none;width:68px}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-weight:600}
.li .nm:hover{text-decoration:underline}
.boxes{display:flex;gap:5px;flex:none}
.box{width:22px;height:22px;border-radius:5px;border:2px solid var(--red);background:transparent;display:grid;place-items:center;padding:0;color:#fff}
.box.r{border-color:var(--orange)}
.box.on{background:var(--red)}
.box.r.on{background:var(--orange)}
.box svg{width:13px;height:13px}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--red);vertical-align:-2px;margin-right:5px}
.legend i.r{border-color:var(--orange)}

/* home */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px;max-width:780px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow);min-width:0}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat b{font-size:20px}}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{color:var(--muted);font-size:13.5px}
.serie{margin-top:26px;background:color-mix(in srgb,var(--surface) 45%,var(--bg));border:1px solid var(--line);border-radius:20px;padding:20px 22px 24px}
.serie h2{font-size:21px;margin:0 0 18px;font-weight:800;display:flex;align-items:center;gap:10px}
.serie h2 small{font-size:13px;color:var(--muted);font-weight:600}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px 18px}
@media (max-width:480px){.serie{padding:16px 12px 18px;border-radius:16px}.sets{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}}
.set{position:relative;display:flex;flex-direction:column;background:var(--surface);border-radius:12px;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;min-width:0;aspect-ratio:2.9/1}
.set:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(20,25,60,.14)}
.set .lg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:7% 6% 6%}
.set .lg img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.set .lg .txt{font-weight:800;text-align:center;font-size:clamp(13px,1.4vw,17px);line-height:1.15}
.set .badge.img{background:none;border:0;padding:0;top:-16px;left:8px}
.codeimg{height:32px;width:32px;object-fit:contain;display:block}
.chip .codeimg{height:20px}
.set .badge{position:absolute;top:-9px;left:10px;font:700 11px/1 var(--mono);letter-spacing:.04em;background:#262931;color:#fff;border:2px solid var(--surface);border-radius:5px;padding:3px 6px;z-index:1}
.set .own{position:absolute;top:-9px;right:10px;font:700 11px/1 var(--ui);background:var(--navy);color:#fff;border:2px solid var(--surface);border-radius:999px;padding:3px 8px;font-variant-numeric:tabular-nums}
.set .own.full{background:var(--ok)}
.set .bar{position:absolute;left:12px;right:12px;bottom:7px;height:4px}
@media (max-width:480px){.set{aspect-ratio:2.2/1}.set .badge,.set .own{font-size:10px}}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:6px}
.bar.full i{background:var(--ok)}
.empty-state{padding:60px 0;text-align:center;color:var(--muted)}
.empty-state b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}

/* collection page */
.colset{margin-top:34px}
.colhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.colhead img{height:42px;width:auto}
.colhead h3{margin:0;font-size:19px;font-weight:800}
.colhead .note{margin-left:auto}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(8,10,24,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.sheet{background:var(--surface);border-radius:20px;max-width:960px;width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;padding:26px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.4)}
@media (max-width:760px){.sheet{grid-template-columns:1fr;padding:18px;gap:18px}}
.close{position:absolute;top:12px;right:12px;z-index:2;background:var(--surface-2)}
.big{perspective:1000px;display:flex;justify-content:center;align-items:center}
.holo{touch-action:none;position:relative;width:100%;max-width:380px;aspect-ratio:63/88;border-radius:4.5%/3.3%;transform-style:preserve-3d;transition:transform .12s ease-out;box-shadow:0 18px 40px rgba(0,0,0,.35);overflow:hidden;background:var(--surface-2)}
@media (max-width:760px){.holo{max-width:280px}}
.holo img{width:100%;height:100%;object-fit:cover;display:block}
.holo .glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.38),transparent 55%);mix-blend-mode:overlay;opacity:0;transition:opacity .2s}
.holo:hover .glare{opacity:1}
.info h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em;padding-right:44px}
.info .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);margin-top:6px;font-weight:600}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:18px 0;font-size:14.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.versions{display:flex;flex-direction:column;gap:10px}
.ver{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.ver .vn{font-weight:700}
.ver .vp{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.step{margin-left:auto;display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:3px}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;font-size:19px;font-weight:700;display:grid;place-items:center}
.step button:hover{background:var(--surface-2)}
.step b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.ver{cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.ver.on{border-color:var(--navy)}
.ver.have{background:color-mix(in srgb,var(--ok) 14%,var(--surface-2))}
.navrow{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:20px 0 10px}

/* sync */
.syncsheet{grid-template-columns:1fr;max-width:620px}
.syncsheet textarea{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:10px;font:12px/1.4 var(--mono);resize:vertical}
.syncsheet .acts{display:flex;flex-wrap:wrap;gap:8px}
.confirm{background:color-mix(in srgb,var(--red) 12%,var(--surface));border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:200;box-shadow:var(--shadow)}

/* pokédex */
.regions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:60px}
@media (max-width:720px){.regions{grid-template-columns:1fr}}
.region{display:flex;align-items:center;gap:12px;background:linear-gradient(100deg,var(--surface) 40%,var(--surface-2));border-radius:var(--r);box-shadow:var(--shadow);padding:0 0 0 18px;min-height:104px;text-decoration:none;overflow:hidden;transition:transform .15s;border:1px solid var(--line)}
.region:hover{transform:translateY(-2px)}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.rtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rtop>b{font-size:18px;font-weight:800}
.rtop span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.rtop span b{color:var(--fg);font-size:17px;font-weight:800}
.rart{display:flex;align-items:flex-end;flex:none;height:104px;padding-right:6px}
.rart img{height:92px;width:92px;object-fit:contain;margin-left:-26px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.rart img:first-child{margin-left:0}
@media (max-width:420px){.rart img{height:72px;width:72px;margin-left:-22px}}
.dexhead{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;padding-bottom:60px}
@media (max-width:480px){.mons{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.mon{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px 12px;min-width:0;transition:transform .15s}
.mon:hover{transform:translateY(-2px)}

<script>
"use strict";
const API = "https://api.tcgdex.net/v2/fr";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="7" y="3" width="12" height="17" rx="2" transform="rotate(8 13 11)"/><path d="M5 6.5 4 18a2 2 0 0 0 1.8 2.2l3.2.3"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-9-2v15c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2z"/><path d="M12 6v15"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="5" height="5" rx="1"/><rect x="3" y="15" width="5" height="5" rx="1"/><path d="M11 6.5h10M11 17.5h10"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="m15 18-6-6 6-6"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m9 18 6-6-6-6"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="m15 18-6-6 6-6"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" width="18" height="18"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  versions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="3" width="12" height="16" rx="2"/><path d="M5 6v13a2 2 0 0 0 2 2h9"/></svg>'
};

/* ---------- storage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("pokeclasseur", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("kv", mode); const q = fn(t.objectStore("kv")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return {
    get: k => tx("readonly", s => s.get(k)).catch(() => undefined),
    set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(() => undefined)
  };
})();

/* collection: { cards: { cardId: { s: setId, v: { normal: 1, reverse: 2 } } }, updated } */
const COL_KEY = "pokeclasseur-collection-v1";
let COL = LS.get(COL_KEY, { cards: {}, updated: 0 });
if (!COL.cards) COL = { cards: {}, updated: 0 };
function saveCol() { COL.updated = Date.now(); if (!LS.set(COL_KEY, COL)) toast("Sauvegarde impossible sur cet appareil"); }
const qtyOf = (id, v) => COL.cards[id]?.v?.[v] || 0;
const ownedAny = id => { const v = COL.cards[id]?.v; return !!v && Object.values(v).some(n => n > 0); };
function setQty(card, variant, n) {
  n = Math.max(0, Math.min(99, n));
  const e = COL.cards[card.id] || { s: card.setId, v: {} };
  e.s = card.setId;
  if (card.ok) e.d = card.dx || [];
  if (n) e.v[variant] = n; else delete e.v[variant];
  if (Object.keys(e.v).length) COL.cards[card.id] = e; else delete COL.cards[card.id];
  saveCol();
}
function ownedBySet() {
  const m = {};
  for (const [id, e] of Object.entries(COL.cards)) {
    if (!Object.values(e.v || {}).some(n => n > 0)) continue;
    (m[e.s] ||= { cards: 0, versions: 0 });
    m[e.s].cards++;
    m[e.s].versions += Object.values(e.v).filter(n => n > 0).length;
  }
  return m;
}

/* ---------- rarity ---------- */
/* Rarity marks drawn as SVG, shaped like the symbols printed on the cards (and used by Pokécardex). */
const RAR = [
  [/^commune$/, "circle", 1],
  [/^peu commune$/, "diamond", 2],
  [/^rare$/, "star-o", 3],
  [/^(holo rare|rare holo)$/, "star", 4],
  [/(radieux|high-tech|v$|vmax|vstar|lv\.x|prime|légende|break|gx|ex$|holo rare)/, "star", 4.5],
  [/^double rare$/, "star2", 5],
  [/^ace spec/, "sparkle-pink", 5.5],
  [/^illustration rare$/, "star-gold", 6],
  [/^(ultra rare|rare ultra)$/, "star2-silver", 7],
  [/chromatique.*ultra|shiny ultra/, "star2-teal", 7.5],
  [/chromatique|shiny/, "star-teal", 7.4],
  [/^(illustration spéciale rare|magnifique rare|rare arc-en-ciel|full art)/, "star2-gold", 8],
  [/^(hyper rare|rare secrète|secret rare|rare gold)/, "star3-gold", 9],
  [/méga hyper rare/, "sparkle-gold", 10]
];
function rarity(label) {
  if (!label || /^aucune$/i.test(label)) return { sym: "none", cls: "", rank: 0, label: label || "Sans rareté" };
  const l = label.toLowerCase();
  for (const [re, sym, rank] of RAR) if (re.test(l)) return { sym, cls: "", rank, label };
  return { sym: "diamond-o", cls: "", rank: 3.5, label };
}
function starPts(cx, cy, R) {
  const r = R * 0.42, pts = [];
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, d = i % 2 ? r : R; pts.push((cx + d * Math.cos(a)).toFixed(2) + "," + (cy + d * Math.sin(a)).toFixed(2)); }
  return pts.join(" ");
}
const RCOL = { gold: "#f2b01e", silver: "#a3a9b5", teal: "#25b3b0", pink: "#e0569b" };
const SVG_CACHE = {};
function symSVG(kind) {
  if (SVG_CACHE[kind]) return SVG_CACHE[kind];
  const [shape, tone] = kind.split("-");
  const col = RCOL[tone] || "currentColor";
  let body = "";
  if (shape === "circle") body = `<circle cx="11" cy="11" r="7" fill="${col}"/>`;
  else if (shape === "diamond") body = tone === "o" ? `<path d="M11 3.5 17.5 11 11 18.5 4.5 11z" fill="none" stroke="currentColor" stroke-width="1.6"/>` : `<path d="M11 3 18 11 11 19 4 11z" fill="${col}"/>`;
  else if (shape === "star" && tone === "o") body = `<polygon points="${starPts(11, 11.8, 9)}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>`;

function drawBinder(box, list) {

  const rings = `<div class="spine" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>`;

  box.innerHTML = html;
  const go = d => { const np = CUR.page + d; if (np < 0 || np >= pageCount) return; CUR.page = np; drawCards(); $("#cards").scrollIntoView({ block: "start", behavior: "smooth" }); };
  $("#pg-prev").onclick = () => go(-1);
  $("#pg-next").onclick = () => go(1);
  const bd = box.querySelector(".binder"); let sx = null, sy = 0;

}

          ${c.il ? `<dt>Illustrateur</dt><dd>${esc(c.il)}</dd>` : ""}
          ${c.rm ? `<dt>Marque</dt><dd>${esc(c.rm)}</dd>` : ""}
        </dl>
        <div class="h3">Ma collection</div>
        <div class="versions" id="vers">${variantsOf(c).map(v => verRow(c, v, v === pv)).join("")}</div>
        ${variantsOf(c).length > 1 ? `<p class="note" style="margin-top:8px">Clique sur une version pour la voir sur la carte.</p>` : ""}
        <div class="navrow">
          <button class="pill ghost" id="m-prev" ${idx === 0 ? "disabled" : ""}>${ICON.prev}</button>

        </div>
        <p class="note" style="margin-top:14px">Prix : tendance Cardmarket (TCGdex). Utilise ← et → pour passer d'une carte à l'autre.</p>
      </div></div></div>`;
    $("#m-close").onclick = close;

/* how many owned cards show each Pokémon */
function dexCounts() {
  const m = new Map();
  for (const e of Object.values(COL.cards)) {
    if (!e.d || !Object.values(e.v || {}).some(n => n > 0)) continue;
    for (const n of new Set(e.d)) m.set(n, (m.get(n) || 0) + 1);
  }
  return m;
}
/* cards ticked before their details were known have no Pokédex number yet: look them up once */
async function backfillDex() {
  const todo = Object.entries(COL.cards).filter(([, e]) => !e.d);
  if (!todo.length) return false;
  const sets = {};
  for (const [id, e] of todo) (sets[e.s] ||= []).push(id);
  for (const [sid, ids] of Object.entries(sets)) {
    const s = await peekSet(sid); const m = new Map((s?.cards || []).filter(c => c.ok).map(c => [c.id, c]));
    await pool(ids, 8, async id => {
      const c = m.get(id);
      if (c) { COL.cards[id].d = c.dx || []; return; }
      try { const d = await getJSON(`${API}/cards/${encodeURIComponent(id)}`); if (d && COL.cards[id]) COL.cards[id].d = d.dexId || []; } catch {}
    });
  }
  saveCol();
  return true;
}

];
const ptype = k => PROD_TYPES.find(t => t.k === k) || PROD_TYPES[PROD_TYPES.length - 1];
/* product: { id, type, name, qty, opened, price (per unit), bpp (boosters per unit) } — older entries used `sealed` */
function normProd(p) {
  if (p.opened == null) p.opened = p.sealed === false ? p.qty : 0;
  if (p.bpp == null) p.bpp = ptype(p.type).b;
  delete p.sealed;
  return p;
}
const prodsOf = sid => ((COL.products ||= {})[sid] ||= []).map(normProd);
async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, 700 / Math.max(im.width, im.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
    cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/jpeg", .82);
  } finally { URL.revokeObjectURL(url); }
}
function prodVisual(p, info) {
  const t = ptype(p.type);
  const logo = logoImg(info.id, info.logo, info.name, info.serie?.id, true) || `<b>${esc(info.name)}</b>`;

}

/* ================= SET STATS PAGE ================= */
async function renderSetStats(setId) {
  setNav("series");
  const app = $("#app");
  app.innerHTML = `<section class="band"><div class="wrap" id="sthead"><a class="crumb" href="#/set/${encodeURIComponent(setId)}">${ICON.back} Retour à l'extension</a><div class="empty-state"><b>Calcul de tes stats…</b></div></div></section><div class="wrap" id="stbody"></div>`;
  let data;
  try { data = await loadSet(setId); } catch { $("#sthead").innerHTML += `<div class="empty-state"><b>Impossible de charger cette extension</b>Vérifie ta connexion puis réessaie.</div>`; return; }
  if (location.hash !== "#/stats/" + setId && decodeURIComponent(location.hash) !== "#/stats/" + setId) return;
  const prevCur = CUR; CUR = { setId, data, rar: new Set(), q: "", page: 0, loading: 1 }; /* rarity helpers read the set's official count */
  const { info, cards } = data;
  const vmap = c => COL.cards[c.id]?.v || {};
  const copiesOf = c => Object.values(vmap(c)).reduce((a, b) => a + b, 0);
  const valueOf = c => Object.entries(vmap(c)).reduce((a, [v, n]) => a + priceOf(c, v) * n, 0);
  const own = cards.filter(c => ownedAny(c.id));
  const missing = cards.filter(c => !ownedAny(c.id));
  let vOwn = 0, vTot = 0, revOwn = 0, revTot = 0;
  for (const c of cards) for (const v of variantsOf(c)) { vTot++; const h = qtyOf(c.id, v) > 0; if (h) vOwn++; if (v === "reverse") { revTot++; if (h) revOwn++; } }
  const copies = own.reduce((a, c) => a + copiesOf(c), 0);
  const doubles = own.filter(c => copiesOf(c) > 1);
  const extra = doubles.reduce((a, c) => a + copiesOf(c) - 1, 0);
  const value = own.reduce((a, c) => a + valueOf(c), 0);
  const toComplete = missing.reduce((a, c) => a + (priceOf(c, mainVariant(c)) || 0), 0);
  const official = info.official || cards.length;
  const isMain = c => /^\d+$/.test(c.n) && +c.n <= official;
  const ownMain = own.filter(isMain).length, ownSecret = own.length - ownMain, nSecret = cards.length - official;
  const prods = prodsOf(setId);
  const spent = prods.reduce((a, p) => a + p.qty * (p.price || 0), 0);
  const boosters = prods.reduce((a, p) => a + p.opened * p.bpp, 0);
  const spentOpened = prods.reduce((a, p) => a + p.opened * (p.price || 0), 0);
  const perBooster = boosters ? spentOpened / boosters : 0;
  const sealedLeft = prods.reduce((a, p) => a + (p.qty - p.opened), 0);
  const sealedVal = prods.reduce((a, p) => a + (p.qty - p.opened) * (p.price || 0), 0);
  const balance = value - spent;
  const pct = Math.round(own.length / cards.length * 100);
  /* hits = copies of special rares (ex, full art, illustrations, gold…) */
  const hitCards = own.filter(isSpecial);
  const hits = hitCards.reduce((a, c) => a + copiesOf(c), 0);
  const hitGroups = new Map();
  for (const c of cards.filter(isSpecial)) {
    const k = rareShort(c), r = rarity(c.r);
    if (!hitGroups.has(k)) hitGroups.set(k, { name: k, sym: r.sym, rank: r.rank, n: 0, o: 0, copies: 0 });
    const g = hitGroups.get(k); g.n++; if (ownedAny(c.id)) { g.o++; g.copies += copiesOf(c); }
  }
  const hitRows = [...hitGroups.values()].sort((a, b) => a.rank - b.rank);
  const rarGroups = new Map();
  for (const c of cards) { const r = rarity(c.r); if (!rarGroups.has(r.sym)) rarGroups.set(r.sym, { r, labels: new Set(), n: 0, o: 0 }); const g = rarGroups.get(r.sym); g.labels.add(c.r || "Sans rareté"); g.n++; if (ownedAny(c.id)) g.o++; }
  const rarRows = [...rarGroups.values()].sort((a, b) => a.r.rank - b.r.rank);
  const best = [...own].sort((a, b) => valueOf(b) - valueOf(a));
  const count = (arr, f) => { const m = new Map(); for (const c of arr) for (const k of [].concat(f(c) || [])) if (k) m.set(k, (m.get(k) || 0) + 1); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  const topIll = count(own, c => c.il)[0], topType = count(own.filter(c => c.t), c => c.t.split(", "))[0];
  const nPoke = own.filter(c => c.cat === "Pokémon").length, nTrainer = own.filter(c => c.cat === "Dresseur").length, nEnergy = own.filter(c => c.cat === "Énergie").length;
  const money = n => n ? eur(n) : "0 €";
  const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;
  const tile = (c, sub) => `<button class="tile ${ownedAny(c.id) ? "owned" : "missing"} stile" data-card="${esc(c.id)}"><span class="cardimg">${imgTag(c, "low")}${fxHTML(foilOf(c))}</span><span class="cap"><span class="n">${esc(numLabel(c, info))}</span><span class="nm">${esc(c.name)}</span><span class="pr">${sub}</span></span></button>`;

  $("#sthead").innerHTML = `<a class="crumb" href="#/set/${encodeURIComponent(setId)}">${ICON.back} Retour à l'extension</a>
    <div class="sthero">
      <div class="logo">${logoImg(info.id, info.logo, info.name, info.serie?.id, true)}</div>
      <div class="sttitle"><div class="eyebrow">Stats de ta collection</div><h1>${esc(info.name)}</h1>
      <div class="progress"><div class="ring" style="--p:${pct}" data-l="${pct}%"></div><div><div class="t">${own.length} / ${cards.length} cartes</div><div class="s">${vOwn} / ${vTot} versions · ${ownMain}/${official} normales${nSecret > 0 ? ` · ${ownSecret}/${nSecret} secrètes` : ""}</div></div></div></div>
    </div>`;

  $("#stbody").innerHTML = `
    <div class="kpis">
      <div class="kpi accent"><span>Valeur de ta collection</span><b>${money(value)}</b><small>prix tendance Cardmarket</small></div>
      <div class="kpi"><span>Argent investi</span><b>${money(spent)}</b><small>${prods.length ? plural(prods.length, "achat") + " noté" + (prods.length > 1 ? "s" : "") : "aucun achat noté"}</small></div>
      <div class="kpi ${spent ? (balance >= 0 ? "good" : "bad") : ""}"><span>Bilan</span><b>${spent ? (balance >= 0 ? "+" : "−") + money(Math.abs(balance)) : "–"}</b><small>valeur des cartes − argent investi</small></div>
      <div class="kpi"><span>Boosters ouverts</span><b>${boosters}</b><small>${perBooster ? `${eur(perBooster)} le booster en moyenne` : "ajoute tes achats pour le prix"}</small></div>
      <div class="kpi"><span>Hits</span><b>${hits}</b><small>${boosters && hits ? `1 hit tous les ${(boosters / hits).toFixed(1).replace(".", ",")} boosters` : boosters ? "aucun hit pour l'instant" : "ex, Full Art, illustrations, Gold…"}</small></div>
      <div class="kpi"><span>Valeur tirée par booster</span><b>${boosters ? eur(value / boosters) : "–"}</b><small>${boosters && perBooster ? (value / boosters >= perBooster ? "plus que le prix payé" : "moins que le prix payé") : "valeur ÷ boosters ouverts"}</small></div>
      <div class="kpi"><span>Exemplaires</span><b>${copies}</b><small>${extra ? plural(extra, "carte") + " en double" : "aucun double"}</small></div>
      <div class="kpi"><span>Pour compléter</span><b>${money(toComplete)}</b><small>${plural(missing.length, "carte")} manquante${missing.length > 1 ? "s" : ""}</small></div>
    </div>

    <section class="stsec"><div class="sthead2"><h2>Tes achats</h2><button class="pill" id="add-buy">+ Ajouter un achat</button></div>
      ${prods.length ? `<div class="buys">${prods.map(p => buyTile(p, info)).join("")}</div>${sealedLeft ? `<p class="note" style="margin-top:10px">${plural(sealedLeft, "produit")} encore scellé${sealedLeft > 1 ? "s" : ""}, pour ${money(sealedVal)}.</p>` : ""}`
        : `<div class="empty-state" style="padding:24px 0"><b>Aucun achat noté</b>Ajoute tes boosters, displays et coffrets pour voir l'argent investi, le prix moyen d'un booster et ton taux de hit.</div>`}
    </section>

    <div class="stcols">
      <section class="stsec"><h2>Ton taux de hit</h2>
        <div class="panel">
          ${hitRows.length ? `<div class="hitrows"><div class="hitrow head"><span>Rareté</span><span>Tirées</span><span>Différentes</span><span>Taux</span></div>${hitRows.map(g => `<div class="hitrow"><span class="rl">${symSVG(g.sym)}<span>${esc(g.name)}</span></span><span>${g.copies}</span><span>${g.o}/${g.n}</span><span>${boosters && g.copies ? `1 / ${Math.round(boosters / g.copies)}` : "–"}</span></div>`).join("")}</div>
          <p class="note" style="margin-top:10px">« 1 / 12 » veut dire une carte de cette rareté tous les 12 boosters ouverts. Les cartes achetées à l'unité comptent aussi.</p>` : `<p class="note">Cette extension n'a pas de rares spéciales.</p>`}
        </div>
      </section>
      <section class="stsec"><h2>Par rareté</h2>
        <div class="panel rrows">${rarRows.map(g => { const p = Math.round(g.o / g.n * 100); return `<div class="rrow"><span class="rl">${symSVG(g.r.sym)}<span>${esc([...g.labels].join(" · "))}</span></span><span class="rbar"><i style="width:${p}%"></i></span><span class="rn">${g.o}/${g.n}</span></div>`; }).join("")}</div>
      </section>
    </div>

    <section class="stsec"><h2>En bref</h2>
      <div class="facts2">
        ${best[0] ? `<div><span>Ta carte la plus chère</span><b>${esc(best[0].name)}</b><small>${eur(valueOf(best[0]))}</small></div>` : ""}
        <div><span>Reverse complétées</span><b>${revOwn} / ${revTot}</b><small>${revTot ? Math.round(revOwn / revTot * 100) : 0} % des reverse</small></div>
        <div><span>Répartition</span><b>${nPoke} Pokémon</b><small>${plural(nTrainer, "Dresseur")} · ${plural(nEnergy, "Énergie")}</small></div>
        ${topType ? `<div><span>Type le plus présent</span><b>${esc(topType[0])}</b><small>${plural(topType[1], "carte")}</small></div>` : ""}
        ${topIll ? `<div><span>Illustrateur préféré</span><b>${esc(topIll[0])}</b><small>${plural(topIll[1], "carte")} dans ta collection</small></div>` : ""}
        <div><span>Valeur moyenne d'une carte</span><b>${copies ? eur(value / copies) : "–"}</b><small>sur tes ${plural(copies, "exemplaire")}</small></div>
      </div>
    </section>

    ${best.length ? `<section class="stsec"><h2>Tes cartes les plus chères</h2><div class="grid smallgrid">${best.slice(0, 8).map(c => tile(c, eur(valueOf(c)))).join("")}</div></section>` : ""}
    ${doubles.length ? `<section class="stsec"><h2>Tes doubles <small>${plural(extra, "carte")} à échanger</small></h2><div class="grid smallgrid">${doubles.map(c => tile(c, "×" + copiesOf(c))).join("")}</div></section>` : ""}
    ${missing.length ? `<section class="stsec"><h2>Les manquantes les plus chères</h2><div class="grid smallgrid">${[...missing].sort((a, b) => (b.p || 0) - (a.p || 0)).slice(0, 8).map(c => tile(c, c.p ? eur(c.p) : "")).join("")}</div></section>` : ""}
    <p class="note" style="padding-block:24px 60px">Prix : tendance Cardmarket du jour (via TCGdex). Les reverse utilisent le prix reverse quand il existe.</p>`;

  const redraw = () => { if (location.hash.startsWith("#/stats/")) renderSetStats(setId); };
  $("#add-buy").onclick = () => openBuyPicker(info, redraw);
  $("#stbody").querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openProductForm(info, prods.find(p => p.id === b.dataset.edit), redraw));
  $("#stbody").querySelectorAll("[data-card]").forEach(b => b.onclick = () => { const c = cards.find(x => x.id === b.dataset.card); openCard(c, cards); });
  loadProdPhotos($("#stbody"));
  void prevCur;
}

/* ================= SYNC ================= */
function encodeCol() { return btoa(unescape(encodeURIComponent(JSON.stringify({ app: "pokeclasseur", v: 1, ...COL })))); }
function decodeCol(txt) {
  txt = txt.trim();
  let o; try { o = JSON.parse(txt); } catch { o = JSON.parse(decodeURIComponent(escape(atob(txt)))); }
  if (!o || typeof o.cards !== "object") throw new Error("format");
  return { cards: o.cards, products: o.products || {}, updated: o.updated || Date.now() };
}
function openSync() {
  const root = $("#modal-root");
  const n = Object.keys(COL.cards).length;
  root.innerHTML = `<div class="modal" id="mdl"><div class="sheet syncsheet" role="dialog" aria-modal="true" aria-label="Sauvegarde">
    <button class="iconbtn close" id="m-close" aria-label="Fermer">${ICON.x}</button>
    <div class="info"><h2>Sauvegarde et synchro</h2>
    <p class="note">Ta collection (${n} cartes) est enregistrée dans ce navigateur. Pour la retrouver sur ton téléphone ou ton PC, copie le code ici et colle-le de l'autre côté, ou passe par un fichier.</p>
    <div class="h3">Envoyer vers un autre appareil</div>
    <div class="acts"><button class="pill" id="s-copy">Copier le code</button><button class="pill ghost" id="s-file">Télécharger un fichier</button></div>
    <div class="h3">Récupérer depuis un autre appareil</div>
    <textarea id="s-in" placeholder="Colle ici le code copié sur l'autre appareil"></textarea>
    <div class="acts" style="margin-top:8px"><button class="pill" id="s-merge">Fusionner avec ma collection</button><button class="pill ghost" id="s-replace">Remplacer ma collection</button><label class="pill ghost" for="s-upload" style="cursor:pointer">Ouvrir un fichier</label><input type="file" id="s-upload" accept=".json,application/json,text/plain" hidden></div>
    <div id="s-confirm" style="margin-top:10px"></div>
    </div></div></div>`;
  const close = () => { root.innerHTML = ""; route(); };
  $("#m-close").onclick = close; $("#mdl").onclick = e => { if (e.target.id === "mdl") close(); };
  $("#s-copy").onclick = async () => { const code = encodeCol(); try { await navigator.clipboard.writeText(code); toast("Code copié"); } catch { $("#s-in").value = code; $("#s-in").select(); toast("Sélectionne et copie le code"); } };
  $("#s-file").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: "pokeclasseur", v: 1, ...COL }, null, 1)], { type: "application/json" })); a.download = `pokeclasseur-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  $("#s-upload").onchange = async e => { const f = e.target.files[0]; if (f) $("#s-in").value = await f.text(); };
  const read = () => { try { return decodeCol($("#s-in").value); } catch { toast("Code invalide"); return null; } };
  $("#s-merge").onclick = () => {
    const inc = read(); if (!inc) return;
    for (const [id, e] of Object.entries(inc.cards)) { const cur = COL.cards[id] || { s: e.s, v: {} }; for (const [v, q] of Object.entries(e.v || {})) cur.v[v] = Math.max(cur.v[v] || 0, q); if (Object.keys(cur.v).length) COL.cards[id] = cur; }
    COL.products ||= {};
    for (const [sid, arr] of Object.entries(inc.products || {})) { const cur = COL.products[sid] ||= []; for (const p of arr) if (!cur.some(x => x.id === p.id)) cur.push(p); }
    saveCol(); toast("Collections fusionnées"); close();
  };
  $("#s-replace").onclick = () => {
    const inc = read(); if (!inc) return;
    $("#s-confirm").innerHTML = `<div class="confirm"><span>Remplacer tes ${n} cartes par les ${Object.keys(inc.cards).length} du code ?</span><button class="pill" id="s-yes">Oui, remplacer</button><button class="pill ghost" id="s-no">Annuler</button></div>`;
    $("#s-yes").onclick = () => { COL = inc; saveCol(); toast("Collection remplacée"); close(); };
    $("#s-no").onclick = () => $("#s-confirm").innerHTML = "";
  };
}
$("#btn-sync").onclick = openSync;

/* ================= ROUTER ================= */
function route() {
  $("#modal-root").innerHTML = ""; document.body.style.overflow = "";
  const h = decodeURIComponent(location.hash.slice(1) || "/");
  const m = h.match(/^\/set\/(.+)$/);
  const dx = h.match(/^\/pokedex(?:\/([a-z]+))?/);
  if (m) renderSet(m[1]);
  else if (dx) renderPokedex(dx[1]);
  else if (h.startsWith("/stats/")) renderSetStats(h.slice(7));
  else if (h.startsWith("/collection")) renderCollection();
  else renderHome();
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
addEventListener("storage", e => { if (e.key === COL_KEY) { COL = LS.get(COL_KEY, COL); } });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (PREF.view === "binder" && $("#cards")) drawCards(); }, 200); });
route();
</script>
</body>
